<!doctype html>
<html>
  <head>
    <title>Home Page1</title>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .herosection {
        display: flex;
        flex-direction: column;
        line-height: 35px;
      }
      body {
        background-color: aquamarine;
      }
      .card {
        display: flex;
        gap: 50px;
        background-color: aliceblue;
        flex-direction: row;
        width: 600px;
        height: 400px;
        margin: 20px;
        padding: 50px;
        align-content: center;
        margin: auto;
        border-radius: 25px;
      }
      .left-box {
        display: flex;
        flex-direction: column;
        line-height: 35px;
        background-color: azure;
        border-radius: 10px;
        padding-top: 15px;
      }
      /* .domClass{
    background-color: bisque;
} */
      input {
        border-radius: 5px;
        padding-left: 5px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <section class="herosection" id="update" name="update">
        <h2 style="text-align: left; font-weight: bold">Update Variables</h2>
        <label for="inputName">Name(String):</label>
        <input type="text" id="inputName" name="inputName" title="inputName" />

        <label for="inputAge">Age (Number):</label>
        <input type="number" id="inputAge" name="inputAge" title="inputAge" />

        <label for="inputCheck">VIP Status (Boolean):</label>
        <input
          type="checkbox"
          id="inputCheck"
          name="inputCheck"
          title="inputCheck"
          checked
        />

        <label for="colorInput">Card Color:</label>
        <input
          type="color"
          id="colorInput"
          name="colorInput"
          title="colorInput"
          value="aqua"
        />
      </section>
      <section class="domClass">
        <h2 style="text-align: left; font-weight: bold">Live DOM Output</h2>
        <div class="left-box">
          <input
            type="text"
            placeholder="VIP MEMBER"
            style="background-color: darkgoldenrod; border-radius: 10px"
          />
          <label for="num" style="font-weight: bold">6589247krty</label>
          <input
            type="text"
            id="inputName"
            name="inputName"
            title="inputName"
          />
          <label>Age:<span>10</span></label>
        </div>
      </section>
    </div>

      function updateDisplay() {}
    </script>
  </body>
</html>
