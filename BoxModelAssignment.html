<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .box {
        background-color: blue;
        border: 7px solid red;
        border-radius: 15px;
        padding: 50px;
        margin: 20px;
        width: 40%;
        margin: auto;
      }

      h2 {
        padding: 50px;
        border: 3px solid white;
        background-color: white;
        text-align: center;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Card Content</h2>
    </div>
  </body>
</html>
