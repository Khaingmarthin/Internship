<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TailwindCSS Assignment</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="bg-blue-50 mx-auto w-1/2 gap-2 flex flex-col justify-center">
      <h2 class="text-xl font-bold text-black">CSS Utility Simulator</h2>
      <p class="text-sm">
        Change the inputs below to see how atomic classes combine to build UIs
      </p>

      <nav class="flex flex-row gap-4 bg-blue-800 p-2">
        <span class="text-bold text-3xl item-left w-[480px]">MyLogo</span>
        <span class="text-md">Home</span>
        <span class="text-md">About</span>
        <span class="text-md">Contact</span>
      </nav>

      <div class="flex justify-center gap-8 mt-2">
        <span class="bg-green-100 text-center rounded-md px-2 py-2 w-40"
          >Feature1</span
        >
        <span class="bg-green-100 text-center rounded-md px-2 py-2 w-40"
          >Feature2</span
        >
        <span class="bg-green-100 text-center rounded-md px-2 py-2 w-40"
          >Feature3</span
        >
      </div>

      <div class="flex flex-row gap-4 mt-2">
        <section
          class="flex flex-col gap-2 w-1/2 bg-white p-2 rounded-lg shadow-md"
        >
          <h3 class="text-lg font-bold">Utility Controls</h3>

          <label for="inputPadding" id="inputPadding">Padding(Spacing)</label>
          <select class="border-2 rounded-md p-2">
            <option>Medium(p-8)</option>
          </select>

          <label for="backgroundThemes" id="backgroundThemes"
            >Background Theme(Colors)</label
          >
          <select class="border-2 rounded-md p-2">
            <option>Primary value</option>
          </select>

          <label for="textSize" id="textSize">Text Size(Typography)</label>
          <select class="border-2 rounded-md p-2">
            <option>Large(text-xl)</option>
          </select>

          <label for="corner" id="corner">Corner Radius(Borders)</label>
          <select class="border-2 rounded-md p-2">
            <option>Square(Rounded-none)</option>
          </select>

          <label for="shadow" id="shadow">Shadow(Depth)</label>
          <select class="border-2 rounded-md p-2">
            <option>Medium(shadow-md)</option>
          </select>
        </section>
        <section class="bg-blue-100 rounded-md w-1/2">
          <div
            class="bg-blue-500 p-4 gap-4 w-[300px] flex flex-col justify-center mx-auto mt-[10rem]"
          >
            <p class="text-left text-lg font-bold">Alex Walker</p>
            <p class="text-left">
              Full-Stack Web Developer building awesome things with Tailwind CSS
            </p>
          </div>
        </section>
      </div>
      <div class="flex flex-row gap-4 items-left text-white">
        <input
          class="bg-blue-400 rounded-md p-2 mt-2 mb-4 ml-5 w-96 text-lg font-bold"
          type="button"
          value="Submit"
        />
        <input
          class="bg-blue-400 rounded-md p-2 mt-2 mb-4 w-54 text-lg font-bold hover:bg-blue-600 transition-colors duration-300"
          type="button"
          value="Hover me slowly!"
        />
      </div>
    </div>
  </body>
</html>
