<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <main
      class="bg-slate-400 grid grid-cols-4 md:grid-cols-4 sm:grid-cols-1 gap-8 p-4"
    >
      <div class="bg-white p-4 rounded-lg shadow">
        <p class="inline bg-amber-200 rounded-lg p-1">⏲</p>
        <h1 class="font-extrabold">2.4K</h1>
        <p class="text-xs text-gray-500">Page View</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow">
        <p class="inline bg-amber-200 rounded-lg p-1">💰</p>
        <h1 class="font-extrabold">$8.2K</h1>
        <p class="text-xs text-gray-500">Revenue</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow">
        <p class="inline bg-amber-200 rounded-lg p-1">👥</p>
        <h1 class="font-extrabold">892</h1>
        <p class="text-xs text-gray-500">New Users</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow">
        <p class="inline bg-amber-200 rounded-lg p-1">⭐</p>
        <h1 class="font-extrabold">4.9</h1>
        <p class="text-xs text-gray-500">Rating</p>
      </div>
    </main>
  </body>
</html>
